info:
  contact: {}
  description: HTTP endpoints for health checks, service metadata, and risk admin
    insight queries.
  title: Risk Service HTTP API
  version: 1.0.0
paths:
  /api/v1/admin/risk-ips:
    get:
      description: Returns paginated risk IP insight records. When q is provided,
        it is treated as an exact IP lookup.
      parameters:
      - description: Authenticated user ID
        in: header
        name: user_id
        required: true
        type: string
      - description: Authenticated role list. Supports comma-separated values or JSON
          array. Must include 2 (teacher) or 3 (admin).
        in: header
        name: user_roles
        required: true
        type: string
      - description: Page size. Defaults to 20 and is capped at 100.
        in: query
        name: limit
        type: integer
      - description: Pagination offset. Defaults to 0.
        in: query
        name: offset
        type: integer
      - description: Exact IP filter.
        in: query
        name: q
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/transport.RiskIPListResponseDoc'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/transport.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/transport.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/transport.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/transport.ErrorResponse'
      summary: List risk IP insights
      tags:
      - Risk Admin
  /api/v1/admin/risk-ips/{ip}:
    get:
      description: Returns the aggregated insight profile for a single risk IP.
      parameters:
      - description: Authenticated user ID
        in: header
        name: user_id
        required: true
        type: string
      - description: Authenticated role list. Supports comma-separated values or JSON
          array. Must include 2 (teacher) or 3 (admin).
        in: header
        name: user_roles
        required: true
        type: string
      - description: Risk IP address
        in: path
        name: ip
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/transport.RiskIPDetailDoc'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/transport.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/transport.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/transport.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/transport.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/transport.ErrorResponse'
      summary: Get risk IP insight
      tags:
      - Risk Admin
  /api/v1/admin/risk-ips/{ip}/events:
    get:
      description: Returns paginated event history for a single risk IP.
      parameters:
      - description: Authenticated user ID
        in: header
        name: user_id
        required: true
        type: string
      - description: Authenticated role list. Supports comma-separated values or JSON
          array. Must include 2 (teacher) or 3 (admin).
        in: header
        name: user_roles
        required: true
        type: string
      - description: Risk IP address
        in: path
        name: ip
        required: true
        type: string
      - description: Page size. Defaults to 50 and is capped at 200.
        in: query
        name: limit
        type: integer
      - description: Pagination offset. Defaults to 0.
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/transport.RiskIPEventsResponseDoc'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/transport.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/transport.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/transport.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/transport.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/transport.ErrorResponse'
      summary: List risk IP events
      tags:
      - Risk Admin
  /health:
    get:
      description: Returns overall service health and dependency status.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/transport.HealthResponseDoc'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/transport.HealthResponseDoc'
      summary: Service health check
      tags:
      - Health
  /info:
    get:
      description: Returns service name, version, protocol, and exposed endpoints.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/transport.ServiceInfoResponse'
      summary: Service metadata
      tags:
      - Service Info
schemes:
- http
swagger: "2.0"
tags:
- description: Service health probe.
  name: Health
- description: Runtime metadata and exposed endpoint information.
  name: Service Info
- description: Admin-only interfaces for querying risk IP summaries and event history.
  name: Risk Admin
