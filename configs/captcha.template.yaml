# ===============================================================
# Captcha Service - Configuration Template
# Example values for deployment and local adaptation.
# ===============================================================

http:
  port: 8091

grpc:
  port: 9091
  request_timeout_seconds: 5

redis:
  addr: "YOUR_REDIS_IP:6379"
  # Env override: CAPTCHA_REDIS_PASSWORD
  password: "YOUR_REDIS_PASSWORD"
  db: 2
  pool_size: 50
  dial_timeout_seconds: 5
  read_timeout_seconds: 3
  write_timeout_seconds: 3

captcha:
  ttl_seconds: 120
  width: 320
  height: 180
  graph_size_min: 52
  graph_size_max: 64
  slider_tolerance: 8

  image_pool:
    enabled: false
    pool_size: 50
    refresh_interval_minutes: 60

  track_validation:
    enabled: false
    min_points: 15
    min_duration_ms: 800
    max_duration_ms: 15000
    point_tolerance: 20

  external_image_api:
    # Env override: CAPTCHA_CAPTCHA_EXTERNAL_IMAGE_API_URL
    url: ""
    # Env override: CAPTCHA_CAPTCHA_EXTERNAL_IMAGE_API_API_KEY
    api_key: ""
    timeout_seconds: 30
    rate_limit_per_minute: 50
    retry_count: 3

token:
  ttl_seconds: 300
  # Env override: CAPTCHA_TOKEN_SECRET
  secret: "YOUR_TOKEN_SECRET"

nacos:
  enable: true
  server_addr: "YOUR_NACOS_IP:8848"
  # Env override: CAPTCHA_NACOS_NAMESPACE
  namespace: ""
  service_name: "captcha-service"
  group_name: "DEFAULT_GROUP"
  cluster_name: "DEFAULT"
  register_ip: ""
  weight: 1.0
  metadata:
    version: "1.0.0"
    protocol: "http"
    context-path: "/api/v1"
    env: "prod"
