# ===============================================================
# Captcha Service - Production Profile
# Sensitive values should be injected by prefixed env vars.
# ===============================================================

http:
  port: 8091

grpc:
  port: 9091

redis:
  addr: "redis-internal:6379"
  # Env override: CAPTCHA_REDIS_PASSWORD
  password: ""
  db: 2
  pool_size: 100
  dial_timeout_seconds: 5
  read_timeout_seconds: 2
  write_timeout_seconds: 2

captcha:
  ttl_seconds: 120
  width: 320
  height: 180
  graph_size_min: 52
  graph_size_max: 64
  slider_tolerance: 3

  image_pool:
    enabled: true
    pool_size: 10
    refresh_interval_minutes: 60

  track_validation:
    enabled: true
    min_points: 15
    min_duration_ms: 800
    max_duration_ms: 15000
    point_tolerance: 20

  external_image_api:
    # Env override: CAPTCHA_CAPTCHA_EXTERNAL_IMAGE_API_URL
    url: ""
    # Env override: CAPTCHA_CAPTCHA_EXTERNAL_IMAGE_API_API_KEY
    api_key: ""
    timeout_seconds: 30
    rate_limit_per_minute: 50
    retry_count: 3

token:
  ttl_seconds: 300
  # Env override: CAPTCHA_TOKEN_SECRET
  secret: ""

nacos:
  enable: true
  server_addr: "nacos-internal:8848"
  # Env override: CAPTCHA_REGISTRY_NACOS_NAMESPACE
  namespace: ""
  service_name: "captcha-service"
  group_name: "DEFAULT_GROUP"
  cluster_name: "prod-cluster"
  register_ip: ""
  weight: 1.0
  metadata:
    version: "1.0.0"
    protocol: "grpc"
    env: "prod"
