# ===============================================================
# Captcha Service - Development Profile (Local Default)
# 这里的配置作为“保底”，会被 .env 或系统环境变量自动覆盖
# ===============================================================

http:
  port: 8091

grpc:
  port: 9091

redis:
  addr: "127.0.0.1:6379"
  password: ""
  db: 2 # Captcha 使用库 2
  pool_size: 10
  dial_timeout_seconds: 5
  read_timeout_seconds: 3
  write_timeout_seconds: 3

# 验证码业务逻辑配置
captcha:
  ttl_seconds: 300
  width: 320
  height: 180
  graph_size_min: 52
  graph_size_max: 64
  slider_tolerance: 10

  # 图片池配置
  image_pool:
    enabled: false # 开发环境默认关闭，可通过环境变量启用
    pool_size: 100 # 开发环境可以多一些方便测试
    refresh_interval_minutes: 60 # 每小时刷新

  # 轨迹校验配置
  track_validation:
    enabled: false # 开发环境默认关闭，避免影响调试
    min_points: 10 # 开发环境放宽要求
    min_duration_ms: 500
    max_duration_ms: 20000
    point_tolerance: 20 # 端点容差（像素）

  # 外部图片API配置
  external_image_api:
    url: "" # 通过环境变量 CAPTCHA_EXTERNAL_IMAGE_API_URL 注入
    api_key: "" # 通过环境变量 CAPTCHA_EXTERNAL_IMAGE_API_API_KEY 注入
    timeout_seconds: 30
    rate_limit_per_minute: 100
    retry_count: 3

# Token 配置
token:
  ttl_seconds: 600
  secret: "dev_default_secret_key" # 开发环境默认值，生产环境必须通过 TOKEN_SECRET 环境变量注入

# Nacos服务注册配置
nacos:
  enable: false
  server_addr: "127.0.0.1:8848"
  namespace: "" # 环境变量 NACOS_NAMESPACE 为空时使用此默认值
  service_name: "captcha-service"
  group_name: "DEFAULT_GROUP"
  cluster_name: "dev-cluster"
  weight: 1.0
  metadata:
    version: "1.0.0"
    protocol: "http"
    env: "dev"
