# ===============================================================
# Risk Service - Production Profile
# Sensitive values should be injected by prefixed env vars.
# ===============================================================

http:
  port: 9080

grpc:
  port: 9090
  request_timeout_seconds: 5

redis:
  addr: "redis-internal:6379"
  # Env override: RISK_REDIS_PASSWORD
  password: ""
  db: 1
  pool_size: 100
  dial_timeout_seconds: 5
  read_timeout_seconds: 2
  write_timeout_seconds: 2

risk_rules:
  login:
    max_fail_count: 5
    fail_count_expire_minutes: 30
  ip_rate_limit:
    limit: 100
    window_seconds: 1
  user_rate_limit:
    online_self_test:
      limit: 1
      window_seconds: 5
    judge_submission:
      limit: 1
      window_seconds: 10

nacos:
  enable: true
  server_addr: "nacos-internal:8848"
  # Env override: RISK_NACOS_NAMESPACE
  namespace: ""
  service_name: "risk-service"
  group_name: "DEFAULT_GROUP"
  cluster_name: "prod-cluster"
  register_ip: ""
  weight: 1.0
  metadata:
    version: "1.0.0"
    protocol: "grpc"
    env: "prod"
